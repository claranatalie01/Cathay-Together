        <title id="architecture-diagram-2-title">Cathay Together System Architecture</title>
        <desc id="architecture-diagram-2-desc">The React app signs in through Supabase Auth and reads and writes trip data through the Supabase Data API. In the browser, the app combines bundled OAG schedules with saved flight picks and ranks group options by total cost and the spread between arrival or departure times. For itinerary planning, the app calls FastAPI with its JWT. The planner checks identity and membership in Supabase, uses Poe, Tavily and Geoapify to build the itinerary, and saves the result to PostgreSQL. Supabase Realtime sends a notification over WebSocket when a trip member saves their choices. The browser refreshes group data and keeps five-second polling as a fallback.</desc>
